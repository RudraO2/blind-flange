# Team overrides for bmad-build on Blind Flange.
#
# Committed deliberately: the four-day budget is spent on a rate-limited account,
# and the default fan-out exhausts it faster than it builds.

[workflow]

# Disable the Blind Hunter review layer.
#
# Its prompt mandates "find at least ten issues" and "if you have zero findings,
# re-check and keep thinking; do not stop with an empty list." Most stories in
# this build are small and mechanical — a profile patch row, a YAML registry, a
# favicon swap — and forcing ten findings on a thirty-line diff manufactures
# noise that then has to be triaged, paying for the same tokens twice.
#
# Edge Case Hunter and Verification Gap Reviewer remain active. They stop when
# they have nothing to say, which is the property that makes them worth running
# on a small diff.
#
# An empty `instruction` disables a layer; the `id` matches the base entry so
# this replaces it rather than adding a fourth.

[[workflow.review_layers]]
id = "blind-hunter"
name = "Blind Hunter"
instruction = ""

# The one-shot route ships only Blind Hunter, so disabling it outright would leave
# that route with no review at all. Replace it with a single proportionate reviewer
# instead: one subagent, allowed to return nothing when the diff is clean.

[[workflow.oneshot_review_layers]]
id = "blind-hunter"
name = "Story Reviewer"
instruction = """
Launch a context-free subagent with this prompt:

Review the changed files in the current worktree against the acceptance criteria you are given.
Inspect the files directly before reviewing.

Report only what would actually cause a defect, a failed acceptance criterion, or a licence
violation. Ignore style, naming and hypothetical futures.

If the change is sound, say exactly: No findings.
Do not manufacture findings to appear thorough.

Acceptance criteria for this story:

{diff_output}

Do not invoke any skill. Return only the review result.

"""
