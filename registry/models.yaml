# The fleet — one file declares every model Faraday knows about.
#
# CONTEXT.md "Fleet": the set of open-weight models **installed on the box**.
# Story 3.3 makes this the single source the UI model list, the router
# (Stories 3.5-3.6) and the licence loader (Story 3.4) all read from, so
# "how do you add a model?" is answered by editing this file and nothing else.
#
# The three 7B members declared here through 29 August 2026 were removed on the
# 30th, when the model plane stopped being replayed. They were honest
# declarations under `replay`, which downloads no weights — but the only GPU is
# a GTX 1650 Ti with about 3.7 GB free, and a 7B model at Q4 needs more than
# that for its weights alone. Declaring a model the box cannot run made the
# router's decision fiction. The fleet now names what is actually on disk.
#
# LICENCE POLICY (docs/licence-policy.md): eleven enumerated names, widened
# from four by ADR-0006 — Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, ISC,
# 0BSD, Python-2.0, MIT-CMU, BSL-1.0, Zlib, CC0-1.0. Widening the list again is
# an ADR-level decision, never a judgement call at the point of use.
#
# Two members are declared *specifically so the loader refuses them* (Story
# 3.4). Both are the same publisher and release as a permitted member under a
# different licence, so each refusal is checkable in ten seconds.
#
# `runtime_id` is the key under `models:` in llama-swap's own config. It is what
# lets the router's decision reach an actual model: the router selects a fleet
# member by `name`, dispatch resolves that to a `runtime_id`, and llama-swap
# loads it — evicting whatever else was resident, because one model at a time is
# its default and 3.7 GB does not hold two. A refused member has no
# `runtime_id`, because it never runs.
#
# Each `licence` below was verified by reading the licence text or the model
# card in the model repository at the exact `revision` pinned here (NFR1) — not
# from a blog post, not from this project's own tables. Verified 30 August 2026:
#   - Qwen2.5-Coder-1.5B-Instruct  LICENSE file -> "Apache License, Version 2.0"
#   - Qwen3-VL-2B-Instruct         no LICENSE file exists at the pinned revision
#     (HTTP 404); `license: apache-2.0` in README.md YAML frontmatter is the
#     repository's primary declaration. This is the same situation as the
#     removed Qwen2.5-VL-7B entry and rides the same recorded decision of
#     28 August 2026 — see docs/licence-policy.md.
#   - Qwen2.5-3B-Instruct          LICENSE file -> "Qwen RESEARCH LICENSE AGREEMENT"
#   - Qwen2.5-Coder-3B-Instruct    LICENSE file -> "Qwen RESEARCH LICENSE AGREEMENT",
#     same document, same 19 September 2024 release date as the 3B above.
#
# No embedder or reranker is declared: retrieval is past the Phase 0 cut line,
# and declaring unused members would mean verifying licences we do not need.
#
# NOTE ON SHAPE: `lib/registry/fleet.js` parses the subset of YAML this file
# uses — one `fleet:` sequence of maps whose values are quoted strings, inline
# `[a, b]` arrays, or bare scalars. Block scalars (`>` and `|`) are NOT
# supported, so prose belongs in comments like this one, not in a value.

fleet:
  # Serves the `code` and `calculation` task types.
  #
  # 2.33 GiB on disk at Q4_K_M. Text-only, and that is a feature rather than a
  # shortcoming: it makes the router's modality gate produce a real exclusion
  # reason for the drawing lane instead of a decorative one.
  #
  # Replaced Qwen2.5-Coder-1.5B on 1 September 2026. The 1.5B was the smallest
  # Apache-2.0 member of the Coder family and it showed: it writes Python rather
  # than PowerShell (6/9 runnable against 0/9, see
  # docs/measurements/local-inference-lanes/issues/08), and it invented a formula
  # for a pump duty point and then computed it correctly, which is the worst
  # shape a wrong answer can take.
  #
  # The obvious upgrade inside the Coder family is the 3B, and the 3B is the one
  # member of that family under the Qwen Research Licence — it is declared
  # further down purely so the loader refuses it by name. Qwen3-4B is outside the
  # Coder family and squarely Apache-2.0, which is how the size step happens
  # without touching the allow-list.
  #
  # It is a hybrid thinking model. `--reasoning off` in the llama-swap entry
  # turns that off: a `<think>` block would burn the coding lane's 700-token
  # ceiling before the JSON starts, and on a schema-constrained turn the grammar
  # forbids it anyway, so leaving it on buys nothing and costs a plain turn.
  - name: Qwen/Qwen3-4B
    role: coder
    runtime_id: bf-coder
    licence: Apache-2.0
    licence_source: LICENSE file at the pinned revision of Qwen/Qwen3-4B-GGUF
    revision: bc640142c66e1fdd12af0bd68f40445458f3869b
    size: 4B
    quantisation: Q4_K_M
    context: 32768
    runtime_context: 8192
    modalities: [text]
    capabilities: [code-generation, code-reasoning, tool-use, general-reasoning, instruction-following]

  # Serves the `document` and `drawing` task types.
  #
  # 1.03 GiB at Q4_K_M plus a 424 MiB Q8_0 vision projector. The document lane
  # feeds it OCR text rather than a page image, so it usually runs as a text
  # model and pays no vision-encoder cost at all; the image path stays
  # available for drawings.
  #
  # `context` is the model's native window. `runtime_context` is what
  # llama-swap actually starts it with, because a KV cache for 262144 tokens
  # does not fit in this card — the UI must not offer the larger number as if
  # it were available.
  - name: Qwen/Qwen3-VL-2B-Instruct
    role: vision-document
    runtime_id: bf-vision
    licence: Apache-2.0
    licence_source: README.md YAML frontmatter at the pinned revision (no LICENSE file in repo)
    revision: 89644892e4d85e24eaac8bacfd4f463576704203
    size: 2B
    quantisation: Q4_K_M
    context: 262144
    runtime_context: 8192
    modalities: [text, image]
    capabilities: [document-understanding, drawing-understanding, visual-grounding, general-reasoning, instruction-following, tool-use]

  - name: Qwen/Qwen2.5-3B-Instruct
    role: none
    licence: Qwen Research Licence
    licence_source: LICENSE file at the pinned revision
    revision: aa8e72537993ba99e69dfaafa59ed015b17504d1
    size: 3B
    context: 32768
    modalities: [text]
    capabilities: [general-reasoning]
    note: "declared so the loader can refuse it (Story 3.4) — the Qwen Research Licence is outside the allow-list"

  # The sharper refusal case, added 30 August 2026. The Coder family is
  # Apache-2.0 at 0.5B, 1.5B, 7B, 14B and 32B — and 3B alone is not. So the size
  # an engineer reaches for when 1.5B feels too small is the one banned member of
  # the family, and the gate catches it by name rather than by anyone
  # remembering.
  - name: Qwen/Qwen2.5-Coder-3B-Instruct
    role: none
    licence: Qwen Research Licence
    licence_source: LICENSE file at the pinned revision
    revision: 488639f1ff808d1d3d0ba301aef8c11461451ec5
    size: 3B
    context: 32768
    modalities: [text]
    capabilities: [code-generation, code-reasoning]
    note: "declared so the loader can refuse it — the one non-Apache member of the Coder family"
