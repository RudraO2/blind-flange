        <div class="cue clip" id="cue-s08-moe-0" data-start="0.000" data-duration="3.222">But there is something better than swapping, and</div>
        <div class="cue clip" id="cue-s08-moe-1" data-start="3.222" data-duration="2.484">it comes from an old research result.</div>
        <div class="cue clip" id="cue-s08-moe-2" data-start="5.706" data-duration="4.279">When a model runs, its neurons do not all fire equally.</div>
        <div class="cue clip" id="cue-s08-moe-3" data-start="9.985" data-duration="3.804">A small fraction fire for almost every single word.</div>
        <div class="cue clip" id="cue-s08-moe-4" data-start="13.789" data-duration="3.803">The large majority only fire for particular inputs.</div>
        <div class="cue clip" id="cue-s08-moe-5" data-start="17.592" data-duration="3.804">The researchers called them hot neurons and cold neurons.</div>
        <div class="cue clip" id="cue-s08-moe-6" data-start="21.396" data-duration="2.408">The insight is obvious once you hear it.</div>
        <div class="cue clip" id="cue-s08-moe-7" data-start="23.804" data-duration="2.347">Keep the hot part on the fast hardware,</div>
        <div class="cue clip" id="cue-s08-moe-8" data-start="26.151" data-duration="3.804">and let the cold part live in slower memory.</div>
        <div class="cue clip" id="cue-s08-moe-9" data-start="29.955" data-duration="3.803">Modern mixture of experts models are that idea, shipped.</div>
        <div class="cue clip" id="cue-s08-moe-10" data-start="33.758" data-duration="2.841">The model is split into many specialist sections,</div>
        <div class="cue clip" id="cue-s08-moe-11" data-start="36.599" data-duration="1.914">and only a few are used per word.</div>
        <div class="cue clip" id="cue-s08-moe-12" data-start="38.513" data-duration="4.755">So we place them by hand. The always-active parts go on the graphics card.</div>
        <div class="cue clip" id="cue-s08-moe-13" data-start="43.268" data-duration="3.804">The rarely-used experts go into ordinary system memory.</div>
        <div class="cue clip" id="cue-s08-moe-14" data-start="47.072" data-duration="2.922">The result is dramatic. A dense 27 billion</div>
        <div class="cue clip" id="cue-s08-moe-15" data-start="49.994" data-duration="2.783">model at 4-bit takes about 17 gigabytes,</div>
        <div class="cue clip" id="cue-s08-moe-16" data-start="52.777" data-duration="4.280">which fills a 16 gigabyte card completely, with nothing left over.</div>
        <div class="cue clip" id="cue-s08-moe-17" data-start="57.057" data-duration="4.279">A mixture of experts model of similar quality runs in 5 to 7 gigabytes.</div>
        <div class="cue clip" id="cue-s08-moe-18" data-start="61.336" data-duration="2.945">So the real move is not picking a smaller model.</div>
        <div class="cue clip" id="cue-s08-moe-19" data-start="64.281" data-duration="2.761">It is going from dense to mixture of experts.</div>
