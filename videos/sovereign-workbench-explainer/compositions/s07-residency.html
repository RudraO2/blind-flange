        <div id="capband">
        <div class="cue clip" id="cue-s07-residency-0" data-start="0.000" data-duration="4.101">Here is where most teams lose the demo.</div>
        <div class="cue clip" id="cue-s07-residency-1" data-start="4.101" data-duration="2.478">The card cannot hold every model at once. So</div>
        <div class="cue clip" id="cue-s07-residency-2" data-start="6.579" data-duration="2.647">the obvious idea is, unload one, load the next.</div>
        <div class="cue clip" id="cue-s07-residency-3" data-start="9.226" data-duration="4.101">Do not do this. A cold load means starting a process,</div>
        <div class="cue clip" id="cue-s07-residency-4" data-start="13.327" data-duration="2.760">reading gigabytes off the disk, setting up</div>
        <div class="cue clip" id="cue-s07-residency-5" data-start="16.087" data-duration="2.366">the card, and warming everything up.</div>
        <div class="cue clip" id="cue-s07-residency-6" data-start="18.453" data-duration="3.201">Published measurements put that at 37 seconds for a</div>
        <div class="cue clip" id="cue-s07-residency-7" data-start="21.654" data-duration="2.950">small model, and 58 seconds for a vision model.</div>
        <div class="cue clip" id="cue-s07-residency-8" data-start="24.604" data-duration="3.588">Almost a minute, with a judge watching.</div>
        <div class="cue clip" id="cue-s07-residency-9" data-start="28.192" data-duration="4.101">The fix is to stop thinking about loading and unloading,</div>
        <div class="cue clip" id="cue-s07-residency-10" data-start="32.293" data-duration="3.075">and start thinking about where the weights live. Three tiers.</div>
        <div class="cue clip" id="cue-s07-residency-11" data-start="35.368" data-duration="4.101">Tier zero, pinned in VRAM. Never moves.</div>
        <div class="cue clip" id="cue-s07-residency-12" data-start="39.469" data-duration="2.502">The small helpers, the search models, the</div>
        <div class="cue clip" id="cue-s07-residency-13" data-start="41.971" data-duration="2.624">classifier. About two and a half gigabytes.</div>
        <div class="cue clip" id="cue-s07-residency-14" data-start="44.595" data-duration="3.075">Tier one, the model currently answering.</div>
        <div class="cue clip" id="cue-s07-residency-15" data-start="47.670" data-duration="4.613">Tier two, the other models, held warm in ordinary computer memory.</div>
        <div class="cue clip" id="cue-s07-residency-16" data-start="52.283" data-duration="2.682">Waking one of those is just a copy, and</div>
        <div class="cue clip" id="cue-s07-residency-17" data-start="54.965" data-duration="2.957">it takes about one second instead of forty.</div>
        <div class="cue clip" id="cue-s07-residency-18" data-start="57.922" data-duration="2.340">And that is why system RAM, not just VRAM on</div>
        <div class="cue clip" id="cue-s07-residency-19" data-start="60.262" data-duration="3.298">the graphics card, is the specification that actually matters.</div>
