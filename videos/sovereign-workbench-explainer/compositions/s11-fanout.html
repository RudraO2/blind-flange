        <div id="capband">
        <div class="cue clip" id="cue-s11-fanout-0" data-start="0.000" data-duration="4.539">Now let us come back to that first principle, because it pays off here.</div>
        <div class="cue clip" id="cue-s11-fanout-1" data-start="4.539" data-duration="4.539">Remember, generating text is limited by memory speed, not arithmetic.</div>
        <div class="cue clip" id="cue-s11-fanout-2" data-start="9.078" data-duration="5.044">The card reads all the weights for every word, and barely calculates anything.</div>
        <div class="cue clip" id="cue-s11-fanout-3" data-start="14.122" data-duration="3.530">So what happens if you run four requests at the same time?</div>
        <div class="cue clip" id="cue-s11-fanout-4" data-start="17.652" data-duration="4.035">It reads those same weights once, and serves all four.</div>
        <div class="cue clip" id="cue-s11-fanout-5" data-start="21.687" data-duration="2.493">Which means the cost of the weights is paid</div>
        <div class="cue clip" id="cue-s11-fanout-6" data-start="24.180" data-duration="2.550">once, no matter how many agents are running.</div>
        <div class="cue clip" id="cue-s11-fanout-7" data-start="26.730" data-duration="5.044">Each extra agent costs only its own small slice of conversation memory,</div>
        <div class="cue clip" id="cue-s11-fanout-8" data-start="31.774" data-duration="2.906">and total throughput goes up, not down. Roughly one and</div>
        <div class="cue clip" id="cue-s11-fanout-9" data-start="34.680" data-duration="2.642">a half to three times at five concurrent requests.</div>
        <div class="cue clip" id="cue-s11-fanout-10" data-start="37.322" data-duration="5.548">So the leftover space on the card is not spare. It is the parallelism budget.</div>
        <div class="cue clip" id="cue-s11-fanout-11" data-start="42.870" data-duration="5.547">A 10 billion model at 4-bit uses about 6 gigabytes of a 16 gigabyte card.</div>
        <div class="cue clip" id="cue-s11-fanout-12" data-start="48.417" data-duration="6.053">The 9 and a half gigabytes left over is room for roughly 8 to 15 agents</div>
        <div class="cue clip" id="cue-s11-fanout-13" data-start="54.470" data-duration="3.026">working at once on the same model, not one.</div>
        <div class="cue clip" id="cue-s11-fanout-14" data-start="57.496" data-duration="4.539">So when a 12-page inspection report comes in, we do not read it page by page.</div>
        <div class="cue clip" id="cue-s11-fanout-15" data-start="62.035" data-duration="3.026">We put six readers on it simultaneously.</div>
        <div class="cue clip" id="cue-s11-fanout-16" data-start="65.061" data-duration="4.539">And the model was already loaded, so the parallelism was free.</div>
