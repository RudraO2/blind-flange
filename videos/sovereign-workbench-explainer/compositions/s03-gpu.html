        <div class="cue clip" id="cue-s03-gpu-0" data-start="0.000" data-duration="3.011">Now the first principle. And honestly, this</div>
        <div class="cue clip" id="cue-s03-gpu-1" data-start="3.011" data-duration="2.940">one idea explains most of the engineering.</div>
        <div class="cue clip" id="cue-s03-gpu-2" data-start="5.951" data-duration="5.356">To run an AI model, its weights, which are just billions of numbers,</div>
        <div class="cue clip" id="cue-s03-gpu-3" data-start="11.307" data-duration="3.571">have to sit in the memory of a graphics card.</div>
        <div class="cue clip" id="cue-s03-gpu-4" data-start="14.878" data-duration="2.621">That memory is called VRAM, and it is</div>
        <div class="cue clip" id="cue-s03-gpu-5" data-start="17.499" data-duration="3.330">small. A mid-range card has maybe 16 gigabytes.</div>
        <div class="cue clip" id="cue-s03-gpu-6" data-start="20.829" data-duration="3.206">Here is the part most people get wrong. When the</div>
        <div class="cue clip" id="cue-s03-gpu-7" data-start="24.035" data-duration="3.340">model writes text, it produces one word at a time.</div>
        <div class="cue clip" id="cue-s03-gpu-8" data-start="27.375" data-duration="2.775">For every single word, the card has to read</div>
        <div class="cue clip" id="cue-s03-gpu-9" data-start="30.150" data-duration="2.581">the entire set of weights out of memory.</div>
        <div class="cue clip" id="cue-s03-gpu-10" data-start="32.731" data-duration="3.050">Every word, billions of numbers. And then</div>
        <div class="cue clip" id="cue-s03-gpu-11" data-start="35.781" data-duration="2.901">it does almost no arithmetic with them.</div>
        <div class="cue clip" id="cue-s03-gpu-12" data-start="38.682" data-duration="2.513">So the speed of text generation is not</div>

        <div class="cue clip" id="cue-s03-gpu-14" data-start="44.038" data-duration="4.165">It is limited by how fast it can read memory.</div>
