        <div class="cue clip" id="cue-s05-registry-0" data-start="0.000" data-duration="5.290">It says new models must be addable later without redesigning the system.</div>
        <div class="cue clip" id="cue-s05-registry-1" data-start="5.290" data-duration="4.761">That sentence is an instruction, and the instruction is this.</div>
        <div class="cue clip" id="cue-s05-registry-2" data-start="10.051" data-duration="4.232">Models must be data, never code. So we keep a single settings file.</div>
        <div class="cue clip" id="cue-s05-registry-3" data-start="14.283" data-duration="5.290">Each model gets a short block. Its name, where the file sits on disk,</div>
        <div class="cue clip" id="cue-s05-registry-4" data-start="19.573" data-duration="4.232">its fingerprint so we can check nobody tampered with it,</div>
        <div class="cue clip" id="cue-s05-registry-5" data-start="23.805" data-duration="5.290">how much VRAM it needs, what it is good at, and its license.</div>
        <div class="cue clip" id="cue-s05-registry-6" data-start="29.095" data-duration="3.084">Adding next year's model means copying the file in,</div>
        <div class="cue clip" id="cue-s05-registry-7" data-start="32.179" data-duration="3.265">adding about twelve lines to that list, and reloading.</div>
        <div class="cue clip" id="cue-s05-registry-8" data-start="35.444" data-duration="4.761">No code changes anywhere. And here is a detail worth caring about.</div>
        <div class="cue clip" id="cue-s05-registry-9" data-start="40.205" data-duration="2.877">Because the license is a field in that file,</div>
        <div class="cue clip" id="cue-s05-registry-10" data-start="43.082" data-duration="2.942">the loader can simply refuse to load anything</div>
        <div class="cue clip" id="cue-s05-registry-11" data-start="46.024" data-duration="3.174">that is not permissively licensed.</div>
        <div class="cue clip" id="cue-s05-registry-12" data-start="49.198" data-duration="4.232">For a government-owned company, that is not a nice to have.</div>
